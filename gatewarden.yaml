server:
  listen_addr: "127.0.0.1:4000"

database:
  url: "sqlite://app/data/ingress.db?mode=rwc"
  # Production example:
  # url: "postgres://gatewarden:change-me@127.0.0.1:5432/gatewarden"

identity:
  # Keep your existing OIDC / auth proxy in front of Gatewarden.
  # Gatewarden expects trusted identity headers instead of acting as the OIDC relying party itself.
  mode: "trusted_header"
  provider_hint: "external-oidc"
  trusted_headers:
    # Map these to the headers your auth layer already emits.
    authenticated: "X-Authenticated"
    subject: "Remote-User"
    email: "Remote-Email"
    groups: "Remote-Groups"
    provider: "X-Auth-Provider"

security:
  admin_shadow_prefixes:
    - "/admin"
  login_ip_limit:
    rule_id: "protect-login-ip"
    path_prefix: "/api/login"
    rps: 5
    burst: 10
  login_user_limit:
    rule_id: "protect-login-user"
    path_prefix: "/api/login"
    rps: 3
    burst: 6
  console_admin_groups:
    - "admin"
  protected_hosts:
    - "init.cool"
    - "accounts.init.cool"

ai:
  enabled: false
  provider: "openai"
  model: "gpt-4.1-mini"
  api_key_env: "GATEWARDEN_AI_API_KEY"
  # Optional for OpenAI-compatible gateways such as OpenRouter or self-hosted proxies:
  # base_url: "https://api.openai.com/v1"
  timeout_ms: 15000
  system_prompt: "You are Gatewarden, an AI security analyst. Produce concise, evidence-based, operator-reviewable guidance."

observability:
  caddy_access_log:
    # Turn this on after Caddy is writing structured JSON access logs to the mounted path below.
    enabled: false
    # Example target inside the container. Mount your real Caddy JSON log here if Caddy runs elsewhere.
    path: "app/data/caddy-access.jsonl"
    # Caddy log polling interval in milliseconds.
    poll_interval_ms: 1000
  geoip:
    enabled: false
    # Optional MMDB file for country / ASN / proxy enrichment.
    database_path: "app/data/GeoLite2-City.mmdb"

services:
  gatewarden:
    # Builds the all-in-one image from this repository.
    build:
      context: .
      dockerfile: Dockerfile
    image: gatewarden:0.1.5
    container_name: gatewarden
    restart: unless-stopped
    ports:
      # Web console entrypoint. The Rust API stays inside the container.
      - "3000:3000"
    environment:
      # Optional for future split deployments. Keep the default when using this single-container setup.
      CONSOLE_API_BASE_URL: "http://127.0.0.1:4000"
    volumes:
      # Main runtime config. Switch database.url to PostgreSQL here if you want an external database.
      - ./gatewarden.yaml:/opt/gatewarden/gatewarden.yaml:ro
      # SQLite DB, optional MMDB, and local runtime data.
      - ./docker-data:/opt/gatewarden/app/data

[package]
name = "gwaf"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
description = "AI-native WAF for self-hosted apps with deterministic enforcement and reviewable policy workflows."
readme = "../README.crates.md"
keywords = ["waf", "security", "gateway", "caddy", "ai"]
categories = ["web-programming::http-server", "network-programming", "authentication"]

[[bin]]
name = "gatewarden"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
axum.workspace = true
chrono.workspace = true
http.workspace = true
ingress-api = { path = "../crates/ingress-api", version = "0.1.3" }
ingress-caddy = { path = "../crates/ingress-caddy", version = "0.1.3" }
ingress-core = { path = "../crates/ingress-core", version = "0.1.3" }
ingress-gateway = { path = "../crates/ingress-gateway", version = "0.1.3" }
ingress-policy = { path = "../crates/ingress-policy", version = "0.1.3" }
ingress-rate-limit = { path = "../crates/ingress-rate-limit", version = "0.1.3" }
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tokio.workspace = true
maxminddb = "0.27"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = "0.5"

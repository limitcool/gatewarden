[package]
name = "gatewarden"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
axum.workspace = true
chrono.workspace = true
http.workspace = true
ingress-api = { path = "../crates/ingress-api" }
ingress-caddy = { path = "../crates/ingress-caddy" }
ingress-core = { path = "../crates/ingress-core" }
ingress-gateway = { path = "../crates/ingress-gateway" }
ingress-policy = { path = "../crates/ingress-policy" }
ingress-rate-limit = { path = "../crates/ingress-rate-limit" }
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = "0.5"

[workspace]
members = [
  "app",
  "crates/ingress-ai",
  "crates/ingress-api",
  "crates/ingress-caddy",
  "crates/ingress-core",
  "crates/ingress-gateway",
  "crates/ingress-ingest",
  "crates/ingress-policy",
  "crates/ingress-rate-limit",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-only"
authors = ["Gatewarden Contributors"]

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
http = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread"] }

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust check
        run: cargo check

      - name: Rust test
        run: cargo test -p gwaf

      - name: Web typecheck
        run: pnpm --dir web run check

      - name: Web build
        run: pnpm --dir web run build

      - name: Docker smoke build
        run: docker build -t gatewarden:ci .
